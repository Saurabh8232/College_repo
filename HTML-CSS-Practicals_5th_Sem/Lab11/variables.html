<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Variables</title>
    <style>
        :root {
            --main-color: #23303b;
            --accent-color: #e07a3f;
            --soft-bg: #f6f1e9;
            --page-padding: 24px;
        }
        body {
            margin: 0;
            padding: var(--page-padding);
            background: var(--soft-bg);
            color: var(--main-color);
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            line-height: 1.6;
        }
        .wrap { max-width: 700px; margin: 0 auto; }
        .back { color: #0f766e; font-weight: 600; text-decoration: none; font-size: 0.9rem; }
        .sheet { margin-top: 1rem; padding: var(--page-padding); background: #fff; border: 1px solid #ddd3c3; border-radius: 10px; }
        h1 { margin-top: 0; font-family: Georgia, 'Times New Roman', serif; color: var(--accent-color); }
        .tagline { border-left: 5px solid var(--accent-color); padding-left: 1rem; font-style: italic; }
    </style>
</head>
<body>
    <div class="wrap">
        <a class="back" href="index.html">&larr; Back to Lab 11 menu</a>
        <main class="sheet">
            <h1>Custom Properties</h1>
            <p>The heading uses <code>--accent-color</code>, the text uses <code>--main-color</code> and the spacing around the card comes from <code>--page-padding</code>.</p>
            <p class="tagline">Edit one variable in :root to restyle the whole page.</p>
        </main>
    </div>
</body>
</html>
